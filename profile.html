<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мем Битва – Профиль</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo">
      <h1>⚡ Мем Битва</h1>
      <span id="userGreeting">рейтинг + модерация</span>
    </div>
    <div style="display:flex; align-items:center; gap:16px;">
      <div class="balance-box" id="headerBalance">🪙 500</div>
      <button id="logoutBtn" style="background:#cc3333; border:none; padding:6px 16px; border-radius:40px; font-weight:700; color:#fff; cursor:pointer;">Выйти</button>
    </div>
  </header>

  <div class="tabs">
    <a href="index.html" class="tab-btn">🏆 Битвы</a>
    <a href="profile.html" class="tab-btn active">👤 Профиль</a>
    <a href="top.html" class="tab-btn">📊 Топ</a>
    <a href="submit.html" class="tab-btn">📤 Отправить мем</a>
    <a href="admin.html" class="tab-btn" id="adminTab">🛡️ Админ</a>
  </div>

  <div class="profile-card">
    <h2>👤 Игрок: <span id="profileLogin"></span></h2>
    <div class="balance-big" id="profileBalance">🪙 500</div>
    <p style="color:#aaa; margin-bottom:12px;">История операций:</p>
    <div class="history" id="historyList"><p style="color:#666;">Пока нет операций</p></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="common.js"></script>
<script>
  (async function(){
  await initializeApp();
  if (!getCurrentUser()) {
    window.location.replace('login.html');
    return;
  }
  // Скрыть админ-вкладку, если не админ
  const adminTab = document.getElementById('adminTab');
  if (!isAdmin() && adminTab) {
    adminTab.style.display = 'none';
  }
  document.getElementById('userGreeting').textContent = `привет, ${getCurrentUser()}`;
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await logoutUser();
    window.location.replace('login.html');
  });

  {
    const data = getCurrentUserData();
    if (!data) return;
    document.getElementById('headerBalance').textContent = `🪙 ${data.balance}`;
    document.getElementById('profileBalance').textContent = `🪙 ${data.balance}`;
    document.getElementById('profileLogin').textContent = getCurrentUser();
    renderHistory(data.history);
  }
  })();
</script>
</body>
</html>
